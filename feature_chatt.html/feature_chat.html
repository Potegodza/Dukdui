<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dukdui SPU - แชทส่วนตัว</title>
    <link rel="stylesheet" href="feature_chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>


                            <!-- 1 -->
    <div class="app-container">
        <!-- แถบเมนูซ้าย -->
        <aside class="sidebar">
            <h2 class="logo">Dukdui SPU</h2>

            <ul class="menu-list">
                <li><i class="fa-solid fa-house"></i> หน้าแรก</li>
                <li class="active"><i class="fa-solid fa-comment"></i> แชทส่วนตัว</li>
                <li><i class="fa-solid fa-star"></i> แนะนำเรื่องเรียน</li>
                <li><i class="fa-solid fa-book"></i> เทคนิคอ่านหนังสือสรุป</li>
                <li><i class="fa-solid fa-file-lines"></i> ตัวอย่างการเรียน / Resume</li>
                <li><i class="fa-solid fa-users"></i> สุ่มคุยแลกเปลี่ยนความคิด</li>
            </ul>
            <div class="user-profile">
                <div class="avatar"></div>
                <div class="user-info">
                    <span class="username">@csi69</span>
                    <span class="status">ออนไลน์</span>
                </div>
                <i class="fa-solid fa-gear settings-icon"></i>
            </div>
        </aside>

                            <!-- 2 -->


        <!--แชทหลัก-->
        <main class="chat-main-area">

        <!--รายชื่อกิ๊ก -->
            <section class="chat-list-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="ค้นหาชื่อโปรไฟล์เพื่อน @username ...">
                </div>
                <h3>แชทส่วนตัว</h3>

                <div class="contact-list" id="contactList"></div>
            </section>





                        <!-- 3 -->

        <!--หน้าต่างแชท-->
            <section class="chat-window">
                <div class="chat-header">
                    <div class="avatar online" id="activeChatAvatar"></div>
                    <div class="header-info">
                        <span class="name" id="activeChatName">@csi69</span>
                        <span class="status" id="activeChatStatus">ออนไลน์</span>
                    </div>
                </div>

                <!-- กล่องแสดงข้อความ-->
                <div class="chat-messages" id="chatMessages"></div>

                <!-- กล่องพิมพ์ข้อความ -->
                <div class="chat-input-area">
                    <input type="text" id="messageInput" placeholder="พิมพ์ข้อความ...">
                    <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </section>
        </main>
    </div>











    <script src="feature_chat.js"></script>
</body>
</html>
