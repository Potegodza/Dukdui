<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="/app/shared/navigation.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <p id="authStatus" class="auth-status" role="status">กำลังตรวจสอบการเข้าสู่ระบบ...</p>

    <div class="app-container" id="appContainer" hidden>
        <aside data-app-navigation data-active-page="chat"></aside>

        <!-- พื้นที่แสดงเนื้อหาหลัก -->
        <div class="main-content">

            <!-- 1. แชทส่วนตัว -->
            <section id="sectionChat" class="app-section active">
                <div class="chat-list-pane">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="ค้นหาชื่อเพื่อนหรือคีย์เวิร์ด...">
                    </div>
                    <h3>รายชื่อเพื่อน</h3>
                    <p class="connection-status" id="connectionStatus" role="status" aria-live="polite">
                        กำลังเชื่อมต่อแชท...
                    </p>
                    <div class="contact-list" id="contactList">

                    </div>
                </div>

                <div class="chat-window-pane">
                    <div class="chat-header">
                        <div class="avatar" id="activeAvatar"></div>
                        <div class="header-info">
                            <span class="name" id="activeChatName">เลือกเพื่อนเพื่อเริ่มแชท</span>
                            <span class="status" id="activeChatStatus">ออฟไลน์</span>
                        </div>
                        <div class="friend-actions">
                            <button class="friend-action-btn remove-friend-btn" id="removeFriendBtn" type="button" disabled>ลบเพื่อน</button>
                            <button class="friend-action-btn block-friend-btn" id="blockFriendBtn" type="button" disabled>บล็อก</button>
                        </div>
                        <button class="call-btn audio-call-btn" id="audioCallBtn" type="button" disabled>
                            <i data-lucide="phone"></i> โทรเสียง
                        </button>
                        <button class="call-btn video-call-btn" id="videoCallBtn" type="button" disabled>
                            <i data-lucide="video"></i> วิดีโอคอล
                        </button>
                    </div>

                    <div class="chat-messages" id="chatMessages" role="log" aria-live="polite">
                        <div class="message-state">
                            ยังไม่ได้เลือกบทสนทนา
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <input type="text" id="messageInput" maxlength="2000" placeholder="พิมพ์ข้อความของคุณ..." disabled>
                        <button id="sendBtn" type="button" aria-label="ส่งข้อความ" disabled><i data-lucide="send"></i></button>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <div class="call-modal" id="callModal" role="dialog" aria-modal="true" aria-labelledby="callTitle" hidden>
        <section class="call-panel">
            <header class="call-header">
                <div>
                    <h2 id="callTitle">กำลังโทร</h2>
                    <p id="callStatus" role="status" aria-live="polite"></p>
                </div>
            </header>
            <div class="call-video-stage" id="callVideoStage" hidden>
                <video id="remoteCallVideo" autoplay playsinline></video>
                <video id="localCallVideo" autoplay muted playsinline></video>
            </div>
            <div class="call-audio-stage" id="callAudioStage" hidden>
                <i data-lucide="phone"></i>
                <span id="audioCallName"></span>
                <audio id="remoteCallAudio" autoplay></audio>
            </div>
            <div class="call-controls">
                <button class="call-control accept-call-btn" id="acceptCallBtn" type="button" hidden>รับสาย</button>
                <button class="call-control decline-call-btn" id="declineCallBtn" type="button" hidden>ปฏิเสธ</button>
                <button class="call-control" id="cancelCallBtn" type="button" hidden>ยกเลิกการโทร</button>
                <button class="call-control" id="toggleMicBtn" type="button" hidden>ปิดไมค์</button>
                <button class="call-control" id="toggleCameraBtn" type="button" hidden>ปิดกล้อง</button>
                <button class="call-control end-call-btn" id="endCallBtn" type="button" hidden>วางสาย</button>
            </div>
        </section>
    </div>

    <dialog class="friend-action-dialog" id="friendActionDialog" aria-labelledby="friendActionTitle">
        <h2 id="friendActionTitle"></h2>
        <p id="friendActionMessage"></p>
        <div class="friend-action-dialog-buttons">
            <button type="button" id="cancelFriendAction">ยกเลิก</button>
            <button type="button" id="confirmFriendAction">ยืนยัน</button>
        </div>
    </dialog>


    <script src="/app/shared/navigation.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="chat.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
