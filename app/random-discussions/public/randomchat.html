
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dukdui SPU</title>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app/shared/navigation.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // ป้องกันการเข้าหน้าสุ่มคุยโดยยังไม่ได้เลือกหมวดหมู่
        // ตรวจตั้งแต่ก่อนโหลดกล้องและ Socket.IO
        (() => {
            const allowedTopics = [
                'study', 'university', 'career', 'technology', 'lifestyle'
            ];
            const selectedTopic = sessionStorage.getItem('selectedTopic');

            if (!allowedTopics.includes(selectedTopic)) {
                sessionStorage.removeItem('selectedTopic');
                window.location.replace('/random-discussions.html?required=1');
            }
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #091020;
            color: #fff;
            font-family: "Prompt", sans-serif;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            min-height: 100vh;
        }

        /* Main content */
        .main-content {
            min-width: 0;
            padding: 24px 20px;
        }

        .box {
            max-width: 900px;
            margin: 0 auto;
        }

        .box h2 {
            margin-bottom: 16px;
        }

        /* Video */
        .stage {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid #1e293b;
            border-radius: 16px;
            overflow: hidden;
        }

        #other {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #me {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: 25%;
            border-radius: 12px;
            border: 2px solid #fff;
            transform: scaleX(-1);
        }

        #status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: #cfd6e4;
            background: rgba(9, 16, 32, 0.85);
        }

        /* Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 15px;
            color: #fff;
            background: #5b5bff;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #leave {
            background: #ef4444;
        }

        #report {
            background: #f59e0b;
        }

        #like {
            background: #d84e78;
        }

        #like:focus-visible,
        #next:focus-visible,
        #report:focus-visible,
        #leave:focus-visible,
        #start:focus-visible {
            outline: 3px solid #f8d77b;
            outline-offset: 3px;
        }

        .friend-feedback {
            min-height: 24px;
            margin-top: 12px;
            color: #b7d6ff;
            text-align: center;
            font-size: 14px;
        }

        /* Report modal */
        .report-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .report-box {
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
        }

        .report-box h2 {
            margin-bottom: 8px;
        }

        .report-box p {
            color: #94a3b8;
            margin-bottom: 18px;
        }

        .report-box select,
        .report-box textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #091020;
            color: white;
            font-family: inherit;
            font-size: 14px;
        }

        .report-box textarea {
            min-height: 100px;
            resize: vertical;
        }

        .report-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        #cancelReport {
            background: #475569;
        }

        #submitReport {
            background: #ef4444;
        }

        @media (max-width: 768px) {
            .app-layout {
                grid-template-columns: 1fr;
            }

            .main-content {
                padding: 18px 14px;
            }

            .buttons button {
                padding: 10px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="app-layout">
        <aside data-app-navigation data-active-page="random"></aside>
        <main class="main-content">
        <div class="box">

            <h2>สุ่มคุยแลกเปลี่ยนความคิด</h2>

            <div class="stage">
                <video id="other" autoplay playsinline></video>
                <video id="me" autoplay muted playsinline></video>
                <div id="status">กำลังเปิดกล้อง...</div>
            </div>

            <div class="buttons">
                <button id="start" disabled>เริ่มสุ่มจับคู่</button>
                <button id="like" disabled>♡ ถูกใจ</button>
                <button id="next" disabled>ถัดไป</button>
                <button id="report" disabled>⚑ รายงาน</button>
                <button id="leave" disabled>ออก</button>
            </div>
            <p id="friendFeedback" class="friend-feedback" role="status" aria-live="polite"></p>

        </div>
        </main>
    </div>

    <!-- Report modal -->
    <div id="reportModal" class="report-modal">
        <div class="report-box">

            <h2>รายงานผู้ใช้งาน</h2>
            <p>กรุณาเลือกเหตุผลที่ต้องการรายงาน</p>

            <select id="reportReason">
                <option value="">-- เลือกเหตุผล --</option>
                <option value="harassment">คุกคาม / ล่วงละเมิด</option>
                <option value="inappropriate">พฤติกรรมไม่เหมาะสม</option>
                <option value="sexual">เนื้อหาทางเพศ</option>
                <option value="spam">สแปม / โฆษณา</option>
                <option value="violence">ข่มขู่ / ใช้ความรุนแรง</option>
                <option value="other">อื่น ๆ</option>
            </select>

            <textarea
                id="reportDetail"
                placeholder="รายละเอียดเพิ่มเติม (ไม่บังคับ)"
            ></textarea>

            <div class="report-actions">
                <button id="cancelReport">ยกเลิก</button>
                <button id="submitReport">ส่งรายงาน</button>
            </div>

        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script type="module">
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
        import { auth } from '/app/login/firebase.js';

        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        };

        let socketOrigin = '';
        let clientConfigError = null;
        try {
            const response = await fetch('/api/client-config');
            const clientConfig = await response.json();
            if (!response.ok || !clientConfig.success) {
                throw new Error(clientConfig.message || 'โหลดการตั้งค่าเซิร์ฟเวอร์ไม่สำเร็จ');
            }
            socketOrigin = clientConfig.socketOrigin;
        } catch (error) {
            console.error('Client configuration error:', error);
            clientConfigError = error;
        }

        const socket = io(socketOrigin || window.location.origin, {
            autoConnect: false,
            auth: callback => {
                const user = auth.currentUser;
                if (!user) {
                    callback({});
                    return;
                }

                user.getIdToken()
                    .then(token => callback({ token }))
                    .catch(error => {
                        console.error('Firebase ID token error:', error);
                        callback({});
                    });
            }
        });
        let identified = false;

        // DOM elements
        const meVideo = document.getElementById('me');
        const otherVideo = document.getElementById('other');
        const statusBox = document.getElementById('status');

        const startBtn = document.getElementById('start');
        const nextBtn = document.getElementById('next');
        const leaveBtn = document.getElementById('leave');
        const reportBtn = document.getElementById('report');
        const likeBtn = document.getElementById('like');
        const friendFeedback = document.getElementById('friendFeedback');

        const reportModal = document.getElementById('reportModal');
        const reportReason = document.getElementById('reportReason');
        const reportDetail = document.getElementById('reportDetail');
        const cancelReportBtn = document.getElementById('cancelReport');
        const submitReportBtn = document.getElementById('submitReport');

        let pc = null;
        let localStream = null;
        let waitingCandidates = [];
        let currentMatchSessionId = null;
        let friendSaved = false;

        function resetLikeState() {
            currentMatchSessionId = null;
            friendSaved = false;
            likeBtn.disabled = true;
            likeBtn.textContent = '♡ ถูกใจ';
            friendFeedback.textContent = '';
        }

        // Show status
        function showStatus(text) {
            statusBox.textContent = text;
            statusBox.style.display = text ? 'flex' : 'none';
        }

        // Open camera
        async function openCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                meVideo.srcObject = localStream;
                startBtn.disabled = !identified;

                showStatus(identified ? 'กดปุ่ม "เริ่มสุ่มจับคู่" เพื่อเริ่มคุย' : 'กำลังยืนยันบัญชี...');

            } catch (err) {
                console.error('Camera error:', err);

                showStatus(
                    'เปิดกล้องไม่ได้ (' + err.name + ') กรุณากดอนุญาตกล้องและไมโครโฟน'
                );
            }
        }

        // Close peer connection
        function closePeer() {
            if (pc) {
                pc.close();
            }

            pc = null;
            waitingCandidates = [];
            otherVideo.srcObject = null;
        }

        // Create peer connection
        function createPeer() {
            closePeer();

            pc = new RTCPeerConnection(config);

            localStream.getTracks().forEach((track) => {
                pc.addTrack(track, localStream);
            });

            pc.ontrack = (event) => {
                otherVideo.srcObject = event.streams[0];
                showStatus('');
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', {
                        candidate: event.candidate
                    });
                }
            };
        }

        // Start matching
        startBtn.onclick = () => {
            const selectedTopic = sessionStorage.getItem('selectedTopic');

            if (!identified) {
                showStatus('กรุณาเข้าสู่ระบบก่อนเริ่มใช้งาน');
                return;
            }
            if (!['study', 'university', 'career', 'technology', 'lifestyle'].includes(selectedTopic)) {
                sessionStorage.removeItem('selectedTopic');
                window.location.replace('/random-discussions.html?required=1');
                return;
            }

            startBtn.disabled = true;
            nextBtn.disabled = false;
            leaveBtn.disabled = false;
            reportBtn.disabled = true;
            resetLikeState();

            showStatus('กำลังหาคู่...');

            socket.emit('join', {
                topic: selectedTopic
            });
        };

        // Find next partner
        nextBtn.onclick = () => {
            closePeer();

            reportBtn.disabled = true;
            resetLikeState();
            showStatus('กำลังหาคู่ใหม่...');

            socket.emit('next');
        };

        // Leave matching
        leaveBtn.onclick = () => {
            closePeer();

            socket.emit('leave');

            startBtn.disabled = false;
            nextBtn.disabled = true;
            leaveBtn.disabled = true;
            reportBtn.disabled = true;
            resetLikeState();

            reportModal.style.display = 'none';

            showStatus('กดปุ่ม "เริ่มสุ่มจับคู่" เพื่อเริ่มคุย');
        };

        // Open report modal
        reportBtn.onclick = () => {
            if (reportBtn.disabled) return;

            reportReason.value = '';
            reportDetail.value = '';

            reportModal.style.display = 'flex';
        };

        // Cancel report
        cancelReportBtn.onclick = () => {
            reportModal.style.display = 'none';
        };

        // Click outside modal to close
        reportModal.onclick = (event) => {
            if (event.target === reportModal) {
                reportModal.style.display = 'none';
            }
        };


// Submit a report to the server
submitReportBtn.onclick = () => {
    const reason = reportReason.value;
    const detail = reportDetail.value.trim();

    if (!reason) {
        alert('กรุณาเลือกเหตุผลในการรายงาน');
        return;
    }

    if (reportBtn.disabled) {
        alert('ไม่พบคู่สนทนาที่สามารถรายงานได้');
        return;
    }

    submitReportBtn.disabled = true;
    submitReportBtn.textContent = 'กำลังส่ง...';

    socket.emit('submit-report', {
        reason: reason,
        detail: detail
    }, (response) => {

        submitReportBtn.disabled = false;
        submitReportBtn.textContent = 'ส่งรายงาน';

        if (!response || !response.success) {
            alert(response?.message || 'ส่งรายงานไม่สำเร็จ');
            return;
        }

        alert(response.message);

        reportModal.style.display = 'none';
        reportReason.value = '';
        reportDetail.value = '';
    });
};


        // Server events
        socket.on('waiting', () => {
            closePeer();

            reportBtn.disabled = true;
            resetLikeState();
            showStatus('กำลังหาคู่...');
        });

        socket.on('matched', async ({ initiator, sessionId }) => {
            resetLikeState();
            currentMatchSessionId = sessionId;
            likeBtn.disabled = !sessionId;
            showStatus('เจอคู่แล้ว กำลังเชื่อมต่อ...');

            reportBtn.disabled = false;

            createPeer();

            if (initiator) {
                const offer = await pc.createOffer();

                await pc.setLocalDescription(offer);

                socket.emit('signal', {
                    description: pc.localDescription
                });
            }
        });

        likeBtn.onclick = () => {
            if (!currentMatchSessionId || likeBtn.disabled) return;
            likeBtn.disabled = true;
            likeBtn.textContent = 'ส่งถูกใจแล้ว';
            friendFeedback.textContent = '';
            socket.emit('like', { sessionId: currentMatchSessionId });
        };

        function showFriendAdded(sessionId, friendName) {
            if (!sessionId || sessionId !== currentMatchSessionId) return;
            friendSaved = true;
            likeBtn.disabled = true;
            likeBtn.textContent = '✓ เป็นเพื่อนกันแล้ว';
            friendFeedback.textContent = friendName
                ? `ต่างฝ่ายต่างถูกใจ ${friendName} แล้ว เปิดแชทต่อได้ที่หน้าแชท`
                : 'ต่างฝ่ายต่างถูกใจกันแล้ว เปิดแชทต่อได้ที่หน้าแชท';
        }

        socket.on('like-pending', ({ sessionId } = {}) => {
            if (!sessionId || sessionId !== currentMatchSessionId) return;
            likeBtn.disabled = true;
            likeBtn.textContent = 'รออีกฝ่ายกดถูกใจ';
            friendFeedback.textContent = 'จะเพิ่มเป็นเพื่อนเมื่อทั้งสองฝ่ายกดถูกใจ';
        });

        socket.on('like-saved', ({ sessionId, friendName } = {}) => {
            showFriendAdded(sessionId, friendName);
        });

        socket.on('friend-added', ({ sessionId, friendName } = {}) => {
            showFriendAdded(sessionId, friendName);
        });

        socket.on('like-error', ({ message } = {}) => {
            friendFeedback.textContent = message || 'เพิ่มเพื่อนไม่สำเร็จ กรุณาลองอีกครั้ง';
            likeBtn.disabled = !currentMatchSessionId;
            likeBtn.textContent = '♡ ถูกใจ';
        });

        socket.on('signal', async (data) => {
            if (!pc) return;

            if (data.description) {
                await pc.setRemoteDescription(data.description);

                // Add candidates received early
                for (const candidate of waitingCandidates) {
                    await pc.addIceCandidate(candidate);
                }

                waitingCandidates = [];

                if (data.description.type === 'offer') {
                    const answer = await pc.createAnswer();

                    await pc.setLocalDescription(answer);

                    socket.emit('signal', {
                        description: pc.localDescription
                    });
                }

            } else if (data.candidate) {
                if (pc.remoteDescription) {
                    await pc.addIceCandidate(data.candidate);
                } else {
                    waitingCandidates.push(data.candidate);
                }
            }
        });

        // Partner left
        socket.on('partner-left', () => {
            closePeer();

            reportBtn.disabled = true;
            currentMatchSessionId = null;
            likeBtn.disabled = true;
            if (!friendSaved) {
                likeBtn.textContent = '♡ ถูกใจ';
            }

            showStatus('อีกฝั่งออกไปแล้ว กำลังหาคู่ใหม่...');
        });

        // Report error from server (if supported)
        socket.on('match-error', (message) => {
            showStatus(message);

            startBtn.disabled = false;
            nextBtn.disabled = true;
            leaveBtn.disabled = true;
            reportBtn.disabled = true;
            resetLikeState();
        });

        socket.on('user-warning', data => {
            alert('คำเตือนจากผู้ดูแลระบบ\\n' + (data?.reason || 'กรุณาปฏิบัติตามกติกาการใช้งาน'));
        });

        socket.on('user-banned', data => {
            identified = false;
            closePeer();
            startBtn.disabled = true;
            nextBtn.disabled = true;
            leaveBtn.disabled = true;
            reportBtn.disabled = true;
            showStatus('บัญชีนี้ถูกระงับการใช้งาน ' + (data?.reason || ''));
            alert('บัญชีถูกระงับการใช้งาน\\n' + (data?.reason || '') +
                (data?.expiresAt ? '\\nสิ้นสุด: ' + new Date(data.expiresAt).toLocaleString('th-TH') : '\\nระงับถาวร'));
        });

        socket.on('connect', () => {
            identified = true;
            if (localStream) {
                startBtn.disabled = false;
                showStatus('ยืนยันบัญชีแล้ว กดเริ่มสุ่มจับคู่ได้เลย');
            } else {
                openCamera();
            }
        });

        socket.on('connect_error', error => {
            identified = false;
            startBtn.disabled = true;
            nextBtn.disabled = true;
            leaveBtn.disabled = true;
            reportBtn.disabled = true;

            if (error.data?.code === 'ACCOUNT_BANNED') {
                const data = error.data;
                showStatus('บัญชีนี้ถูกระงับการใช้งาน ' + (data.reason || ''));
                alert('บัญชีถูกระงับการใช้งาน\\n' + (data.reason || '') +
                    (data.expiresAt ? '\\nสิ้นสุด: ' + new Date(data.expiresAt).toLocaleString('th-TH') : '\\nระงับถาวร'));
                socket.disconnect();
                return;
            }

            showStatus('ยืนยันบัญชีหรือเชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาเข้าสู่ระบบใหม่');
        });

        socket.on('disconnect', () => {
            identified = false;
            startBtn.disabled = true;
            nextBtn.disabled = true;
            leaveBtn.disabled = true;
            reportBtn.disabled = true;
            resetLikeState();
            showStatus('การเชื่อมต่อขาดหาย กำลังเชื่อมต่อใหม่...');
        });

        onAuthStateChanged(auth, user => {
            if (!user) {
                socket.disconnect();
                window.location.replace('/app/login/login.html');
                return;
            }
            if (clientConfigError) {
                showStatus(clientConfigError.message);
                return;
            }
            socket.connect();
        });

    </script>
    <script src="/app/shared/navigation.js"></script>

</body>
</html>
